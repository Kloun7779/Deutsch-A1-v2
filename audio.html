<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Режим звука — плеер для немецких слов A1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Verdana, Arial, sans-serif;
    background: linear-gradient(135deg, #2a0845, #6441a5);
    min-height: 100vh;
    padding: 40px 20px 60px;
    color: #fff;
    letter-spacing: 0.3px;
  }

  h1 {
    text-align: center;
    font-size: 1.9rem;
    margin-bottom: 8px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .subtitle {
    text-align: center;
    color: #d4c4ff;
    font-size: 0.95rem;
    margin-bottom: 30px;
    line-height: 1.5;
  }

  /* Панель управления */
  .controls {
    max-width: 640px;
    margin: 0 auto 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .speed-toggle {
    display: inline-flex;
    background: rgba(255,255,255,0.12);
    border-radius: 30px;
    padding: 4px;
    border: 1px solid rgba(255,255,255,0.25);
  }

  .speed-toggle button {
    padding: 7px 16px;
    border: none;
    background: transparent;
    color: #d4c4ff;
    font-size: 0.85rem;
    font-weight: 600;
    border-radius: 25px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .speed-toggle button.active {
    background: #fff;
    color: #2a0845;
  }

  select.deck-select {
    padding: 10px 16px;
    border-radius: 30px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    max-width: 280px;
  }

  select.deck-select option {
    background: #2a0845;
    color: #fff;
  }

  /* Плеер */
  .player {
    max-width: 520px;
    margin: 0 auto;
    background: linear-gradient(160deg, rgba(0,0,0,0.35), rgba(0,0,0,0.15));
    border-radius: 24px;
    padding: 34px 28px 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    text-align: center;
  }

  .deck-name {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #ffd166;
    font-weight: 700;
    margin-bottom: 18px;
    min-height: 20px;
  }

  .word-display {
    font-size: 2.1rem;
    font-weight: 800;
    color: #fff;
    margin: 12px 0 10px;
    min-height: 60px;
    line-height: 1.25;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .pron-display {
    font-size: 1.05rem;
    color: #ffd166;
    font-style: italic;
    margin-bottom: 10px;
    min-height: 24px;
  }

  .trans-display {
    font-size: 1.1rem;
    color: #d4c4ff;
    margin-bottom: 26px;
    min-height: 28px;
  }

  .progress-info {
    font-size: 0.88rem;
    color: #b8a8dd;
    margin-bottom: 10px;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffd166, #a044ff);
    width: 0%;
    transition: width 0.4s;
  }

  .player-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .player-buttons button {
    padding: 14px 20px;
    border: none;
    border-radius: 14px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s;
    font-family: inherit;
    min-width: 100px;
  }

  .player-buttons button:active { transform: scale(0.96); }
  .player-buttons button:disabled { opacity: 0.4; cursor: default; }

  .p-play {
    background: #4caf50;
    color: #fff;
    box-shadow: 0 4px 12px rgba(76,175,80,0.4);
  }

  .p-pause {
    background: #ff9800;
    color: #fff;
    box-shadow: 0 4px 12px rgba(255,152,0,0.4);
  }

  .p-next {
    background: #2196f3;
    color: #fff;
    box-shadow: 0 4px 12px rgba(33,150,243,0.4);
  }

  .p-stop {
    background: #ff5252;
    color: #fff;
    box-shadow: 0 4px 12px rgba(255,82,82,0.4);
  }

  .p-back {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* Настройки */
  .settings-row {
    max-width: 520px;
    margin: 22px auto 0;
    text-align: center;
    font-size: 0.85rem;
    color: #b8a8dd;
  }

  .settings-row label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 6px 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .settings-row input[type="checkbox"] {
    accent-color: #a044ff;
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  /* Информация */
  .info {
    max-width: 520px;
    margin: 30px auto 0;
    padding: 16px 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    font-size: 0.85rem;
    color: #d4c4ff;
    line-height: 1.6;
    text-align: center;
  }

  .info strong { color: #ffd166; }

  @media (max-width: 480px) {
    h1 { font-size: 1.4rem; }
    .word-display { font-size: 1.5rem; }
    .player { padding: 26px 18px 22px; }
    .player-buttons button { padding: 12px 14px; font-size: 0.85rem; min-width: 70px; }
  }
</style>
</head>
<body>

<h1>🎧 Режим звука</h1>
<p class="subtitle">Слушай слова подряд · Учи на слух · Без карточек</p>

<!-- Верхняя панель -->
<div class="controls">
  <select class="deck-select" id="deckSelect" onchange="changeDeck()">
    <option value="all">🎵 Все слова (~340)</option>
    <option value="Глаголы">⚡ Глаголы (44)</option>
    <option value="Вопросы">💬 Вопросы (40)</option>
    <option value="Семья, люди, профессии">👨‍👩‍👧 Семья (50)</option>
    <option value="Дом, квартира, мебель">🏠 Дом (32)</option>
    <option value="Еда, напитки, магазины">🍞 Еда (36)</option>
    <option value="Город, транспорт, места">🏙️ Город (34)</option>
    <option value="Время, дни, месяцы">🕐 Время (38)</option>
    <option value="Тело, здоровье, одежда">💪 Тело (34)</option>
    <option value="Прилагательные">🎨 Прилагательные (42)</option>
    <option value="Наречия">🧭 Наречия (34)</option>
    <option value="Служебные слова">🧩 Служебные (50)</option>
    <option value="Числительные">🔢 Числительные (34)</option>
    <option value="Полезные фразы">💬 Фразы (40)</option>
  </select>

  <div class="speed-toggle">
    <button id="speedSlow" class="active" onclick="setSpeed('slow')">🐢 Медленно</button>
    <button id="speedNormal" onclick="setSpeed('normal')">🐇 Обычно</button>
  </div>
</div>

<!-- Плеер -->
<div class="player">
  <div class="deck-name" id="deckName">— выберите колоду —</div>

  <div class="word-display" id="wordDisplay">Готов к воспроизведению</div>
  <div class="pron-display" id="pronDisplay"></div>
  <div class="trans-display" id="transDisplay"></div>

  <div class="progress-info" id="progressInfo">0 / 0</div>
  <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>

  <div class="player-buttons">
    <button class="p-play" id="playBtn" onclick="play()">▶ Играть</button>
    <button class="p-pause" id="pauseBtn" onclick="pause()" disabled>⏸ Пауза</button>
    <button class="p-next" id="nextBtn" onclick="next()">⏭ Дальше</button>
    <button class="p-stop" id="stopBtn" onclick="stop()" disabled>⏹ Стоп</button>
    <a href="index.html" class="p-back">⌂ Меню</a>
  </div>
</div>

<!-- Настройки -->
<div class="settings-row">
  <label>
    <input type="checkbox" id="showTranslation" checked onchange="updateDisplay()">
    Показывать перевод
  </label>
  &nbsp;
  <label>
    <input type="checkbox" id="autoNext" checked>
    Автопереход
  </label>
</div>

<div class="info">
  <strong>💡 Совет:</strong> выберите колоду → нажмите <strong>▶ Играть</strong> → слушайте слова подряд с переводом. 
  Можно свернуть браузер и учить на слух: на прогулке, лёжа, в дороге.
</div>

  {c:'Полезные фразы', w:'Tschüss', p:'[чюс]', t:'Пока'},
  {c:'Полезные фразы', w:'Auf Wiedersehen', p:'[ауф ви́-дэр-зэ-эн]', t:'До свидания'},
  {c:'Полезные фразы', w:'Bitte', p:'[би́-тэ]', t:'Пожалуйста'},
  {c:'Полезные фразы', w:'Danke schön', p:'[да́н-кэ шён]', t:'Большое спасибо'},
  {c:'Полезные фразы', w:'Entschuldigung', p:'[энт-шу́ль-ди-гунг]', t:'Извините'},
  {c:'Полезные фразы', w:'Es tut mir leid', p:'[эс тут мир ляйд]', t:'Мне жаль'},
  {c:'Полезные фразы', w:'Wie bitte?', p:'[ви би́-тэ]', t:'Простите?'},
  {c:'Полезные фразы', w:'Ich verstehe nicht', p:'[ихь фэр-штэ́-э нихьт]', t:'Я не понимаю'},
  {c:'Полезные фразы', w:'Ich weiß nicht', p:'[ихь вайс нихьт]', t:'Я не знаю'},
  {c:'Полезные фразы', w:'Alles klar', p:'[а́-лэс клар]', t:'Всё понятно'}
];
OTHER.forEach(o => AUDIO_CARDS.push(o));

/* =====================================================
   ЛОГИКА ПЛЕЕРА
   ===================================================== */

let currentSpeed = 0.6;
let deck = [];
let deckName = 'all';
let currentIndex = 0;
let isPlaying = false;
let timer = null;

const FEMALE_VOICE_NAMES = ['anna','katja','marlene','vicki','petra','helena','google deutsch'];
const MALE_VOICE_NAMES = ['hans','stefan','klaus','yannick','conrad'];

let cachedVoices = [];
function loadVoices() { cachedVoices = window.speechSynthesis.getVoices(); }

function pickGermanFemaleVoice() {
  if (!cachedVoices.length) loadVoices();
  const germanVoices = cachedVoices.filter(v => v.lang === 'de-DE' || v.lang.startsWith('de'));
  if (!germanVoices.length) return null;
  for (const name of FEMALE_VOICE_NAMES) {
    const v = germanVoices.find(g => g.name.toLowerCase().includes(name));
    if (v) return v;
  }
  const nonMale = germanVoices.filter(g => !MALE_VOICE_NAMES.some(m => g.name.toLowerCase().includes(m)));
  if (nonMale.length) return nonMale[0];
  return germanVoices[0];
}

function pickRussianVoice() {
  if (!cachedVoices.length) loadVoices();
  return cachedVoices.find(v => v.lang === 'ru-RU') || cachedVoices.find(v => v.lang.startsWith('ru')) || null;
}

function setSpeed(mode) {
  currentSpeed = (mode === 'slow') ? 0.6 : 0.9;
  document.getElementById('speedSlow').classList.toggle('active', mode === 'slow');
  document.getElementById('speedNormal').classList.toggle('active', mode === 'normal');
}

function changeDeck() {
  deckName = document.getElementById('deckSelect').value;
  if (deckName === 'all') {
    deck = shuffle(AUDIO_CARDS.slice());
    document.getElementById('deckName').textContent = 'Все слова · ' + deck.length;
  } else {
    deck = shuffle(AUDIO_CARDS.filter(c => c.c === deckName));
    document.getElementById('deckName').textContent = deckName + ' · ' + deck.length;
  }
  currentIndex = 0;
  updateDisplay();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateDisplay() {
  const total = deck.length;
  const info = document.getElementById('progressInfo');
  const fill = document.getElementById('progressFill');

  if (!total) {
    document.getElementById('wordDisplay').textContent = 'Нет слов';
    document.getElementById('pronDisplay').textContent = '';
    document.getElementById('transDisplay').textContent = '';
    info.textContent = '0 / 0';
    fill.style.width = '0%';
    return;
  }

  if (currentIndex >= total) {
    document.getElementById('wordDisplay').textContent = 'Готово! 🎉';
    document.getElementById('pronDisplay').textContent = '';
    document.getElementById('transDisplay').textContent = '';
    info.textContent = total + ' / ' + total;
    fill.style.width = '100%';
    return;
  }

  const c = deck[currentIndex];
  document.getElementById('wordDisplay').textContent = c.w;
  document.getElementById('pronDisplay').textContent = c.p || '';
  document.getElementById('transDisplay').textContent =
    document.getElementById('showTranslation').checked ? (c.t || '') : '';

  info.textContent = (currentIndex + 1) + ' / ' + total;
  fill.style.width = ((currentIndex + 1) / total * 100) + '%';
}

function speakCurrent(callback) {
  if (currentIndex >= deck.length) { if (callback) callback(); return; }
  const c = deck[currentIndex];
  window.speechSynthesis.cancel();

  const uDe = new SpeechSynthesisUtterance(c.w);
  uDe.lang = 'de-DE';
  uDe.rate = currentSpeed;
  uDe.pitch = 1.15;
  const voice = pickGermanFemaleVoice();
  if (voice) uDe.voice = voice;

  uDe.onend = () => {
    if (!isPlaying) { if (callback) callback(); return; }

    if (c.t && document.getElementById('showTranslation').checked) {
      timer = setTimeout(() => {
        if (!isPlaying) return;
        const uRu = new SpeechSynthesisUtterance(c.t);
        uRu.lang = 'ru-RU';
        uRu.rate = 0.95;
        uRu.pitch = 1.1;
        const ruVoice = pickRussianVoice();
        if (ruVoice) uRu.voice = ruVoice;
        uRu.onend = () => {
          if (!isPlaying) return;
          timer = setTimeout(() => {
            if (!isPlaying) return;
            currentIndex++;
            updateDisplay();
            speakCurrent();
          }, 1200);
        };
        window.speechSynthesis.speak(uRu);
      }, 400);
    } else {
      timer = setTimeout(() => {
        if (!isPlaying) return;
        currentIndex++;
        updateDisplay();
        speakCurrent();
      }, 1200);
    }
  };

  window.speechSynthesis.speak(uDe);
}

function play() {
  if (currentIndex >= deck.length) currentIndex = 0;
  isPlaying = true;
  document.getElementById('playBtn').disabled = true;
  document.getElementById('pauseBtn').disabled = false;
  document.getElementById('stopBtn').disabled = false;
  speakCurrent();
}

function pause() {
  isPlaying = false;
  clearTimeout(timer);
  window.speechSynthesis.cancel();
  document.getElementById('playBtn').disabled = false;
  document.getElementById('pauseBtn').disabled = true;
}

function stop() {
  isPlaying = false;
  clearTimeout(timer);
  window.speechSynthesis.cancel();
  currentIndex = 0;
  updateDisplay();
  document.getElementById('playBtn').disabled = false;
  document.getElementById('pauseBtn').disabled = true;
  document.getElementById('stopBtn').disabled = true;
}

function next() {
  if (currentIndex + 1 < deck.length) {
    currentIndex++;
    updateDisplay();
    if (isPlaying) {
      clearTimeout(timer);
      window.speechSynthesis.cancel();
      speakCurrent();
    } else {
      speakCurrent();
    }
  }
}

/* Автозапуск при загрузке */
window.addEventListener('load', () => {
  changeDeck();
});

window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();
</script>
